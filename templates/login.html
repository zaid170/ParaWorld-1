<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA WORLD - Secure Admin Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- GLOBAL RESET & THEME --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ZERO-LAG STATIC BACKGROUND */
        body {
            background: linear-gradient(135deg, #020617 0%, #081C36 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle static tech-grid (Uses 0% processor power) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        /* --- SLEEK SOLID CARD --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-card {
            background-color: #0A1526;
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.05);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .brand-subtitle {
            color: #94A3B8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            font-weight: 700;
        }

        /* --- INPUT FIELDS --- */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            color: #94A3B8;
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-input {
            width: 100%;
            background-color: #030A14;
            border: 1px solid #1E293B;
            padding: 15px 20px;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
        }

        .login-input::placeholder {
            color: #475569;
            font-weight: 500;
        }

        .login-input:focus {
            border-color: #00E5FF;
            background-color: #051020;
            box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.1);
        }

        /* --- BUTTON --- */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #00E5FF 0%, #0A3663 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(0, 229, 255, 0.2);
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 229, 255, 0.3);
        }

        .btn-login:disabled {
            background: #1E293B;
            color: #64748B;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- ERROR & DIAGNOSTICS --- */
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
        }

        .security-badge {
            margin-top: 25px;
            color: #64748B;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .security-badge span {
            color: #10B981;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <form class="login-card" id="loginForm">
            
            <h1 class="brand-logo">PARA</h1>
            <div class="brand-subtitle">Administrator Portal</div>

            <div class="error-message" id="errorBanner">Invalid Credentials</div>

            <div class="input-group">
                <label class="input-label">Administrator Email</label>
                <input type="email" id="emailInput" class="login-input" placeholder="admin@paraworld.com" autocomplete="email" required>
            </div>
            
            <div class="input-group">
                <label class="input-label">Secret Key</label>
                <input type="password" id="passwordInput" class="login-input" placeholder="Enter your secure password" required>
            </div>

            <button type="submit" class="btn-login" id="enterBtn">AUTHORIZE</button>

            <div class="security-badge">
                <span>🛡️</span> 256-Bit Encrypted Connection
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const errorBanner = document.getElementById('errorBanner');
            const btn = document.getElementById('enterBtn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault(); 

                const email = emailInput.value;
                const password = passwordInput.value;

                btn.textContent = "VERIFYING...";
                btn.disabled = true;
                errorBanner.style.display = 'none';
                
                try {
                    const response = await fetch('/admin-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const result = await response.json();

                    if (response.ok && result.status === 'success') {
                        // SUCCESS
                        btn.textContent = "ACCESS GRANTED";
                        btn.style.background = "#10B981";
                        btn.style.boxShadow = "0 8px 20px rgba(16, 185, 129, 0.3)";
                        
                        setTimeout(() => {
                            window.location.href = "/admin-dashboard"; 
                        }, 800);

                    } else {
                        // FAILED
                        errorBanner.textContent = result.message || "Invalid administrator email or password.";
                        errorBanner.style.display = 'block';
                        btn.textContent = "AUTHORIZE";
                        btn.disabled = false;
                    }
                } catch (err) {
                    errorBanner.textContent = "Network Error. Please wait a moment and try again.";
                    errorBanner.style.display = 'block';
                    btn.textContent = "AUTHORIZE";
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
