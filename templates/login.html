<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA WORLD - Secure Admin Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- GLOBAL RESET & THEME --- */
        :root {
            --primary-navy: #081C36;
            --accent-gold: #FFB300;
            --accent-cyan: #00E5FF;
            --bg-dark-core: #030408;
            --color-danger: #FF4D4D;
            --color-success: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            /* Deep Space Gradient */
            background: linear-gradient(135deg, #020306 0%, #0a0e17 50%, #050b14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 🚀 GPU ACCELERATION FOR FLAWLESS 60FPS --- */
        .glass-card, .btn-enter, .aurora-orb, .float-item, .brand-header {
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        /* --- LAG-FREE AURORA NEBULA BACKGROUND --- 
           Uses purely radial gradients instead of SVG blurs to guarantee zero lag! */
        .aurora-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora-orb {
            position: absolute;
            border-radius: 50%;
            /* Pure gradient fading to transparent creates a natural glow with NO processing lag */
            background: radial-gradient(circle, var(--orb-color) 0%, transparent 65%);
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        /* Drifting Orbs */
        .orb-1 {
            width: 80vw; height: 80vw;
            top: -20vh; left: -10vw;
            --orb-color: rgba(0, 229, 255, 0.25);
            animation: drift 20s infinite alternate ease-in-out;
        }
        .orb-2 {
            width: 70vw; height: 70vw;
            bottom: -10vh; right: -10vw;
            --orb-color: rgba(10, 54, 99, 0.4);
            animation: drift 25s infinite alternate-reverse ease-in-out;
        }
        .orb-3 {
            width: 50vw; height: 50vw;
            top: 20vh; right: 20vw;
            --orb-color: rgba(255, 179, 0, 0.15);
            animation: drift 18s infinite alternate ease-in-out;
        }

        @keyframes drift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(10vw, 8vh, 0) scale(1.1); }
        }

        /* --- FLOATING EDUCATION ICONS --- */
        .floating-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none; overflow: hidden;
        }

        .float-item {
            position: absolute; bottom: -150px; left: var(--left);
            font-size: var(--size); opacity: 0.12;
            animation: floatUp var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            color: white; filter: grayscale(100%) brightness(200%);
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.15; }
            85% { opacity: 0.15; }
            100% { transform: translate3d(0, -120vh, 0) rotate(360deg); opacity: 0; }
        }

        /* --- HEADER LOGO --- */
        .brand-header {
            position: absolute;
            top: 5vh; left: 50%;
            transform: translate3d(-50%, 0, 0);
            z-index: 100;
            display: flex; flex-direction: column; align-items: center;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.65rem; font-weight: 700;
            color: #ffffff; letter-spacing: 7px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.45);
        }

        /* --- SHARP, SLEEK GLASS CARD (Z-INDEX: 10) --- */
        .glass-wrapper {
            position: relative;
            z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        .glass-card {
            background: rgba(10, 15, 30, 0.6); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 45px 40px;
            width: 390px; max-width: 90vw;
            display: flex; flex-direction: column; align-items: center;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* Subtle glowing edge */
        .glass-card::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 30px;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1);
            pointer-events: none;
        }

        .glass-title {
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff; font-size: 1.45rem; font-weight: 700;
            letter-spacing: 4px; margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* --- INPUT FIELDS --- */
        .input-group {
            width: 100%; margin-bottom: 20px; position: relative;
        }

        .glass-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 15px 22px;
            color: #ffffff; font-size: 0.95rem; font-weight: 500;
            outline: none; transition: all 0.3s ease;
        }

        .glass-input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .glass-input:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        /* --- ERROR BANNER --- */
        .error-banner {
            width: 100%; color: var(--color-danger);
            font-size: 0.85rem; font-weight: 700; text-align: center;
            margin-top: -10px; margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
            display: none; animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            25% { transform: translate3d(-6px, 0, 0); }
            75% { transform: translate3d(6px, 0, 0); }
        }

        /* --- BUTTON & DIAGNOSTICS --- */
        .btn-enter {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-gold) 100%);
            border: none; color: var(--primary-navy);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem; font-weight: 800; letter-spacing: 3px;
            padding: 15px 35px; border-radius: 20px; margin-top: 10px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }

        .btn-enter:hover:not(:disabled) {
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
        }

        .btn-enter:disabled { opacity: 0.6; cursor: not-allowed; background: #475569; color: #94a3b8; }

        .diagnostic-card {
            margin-top: 25px; width: 100%;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px;
        }

        .diag-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 6px; }
        .diag-header h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #ffffff; }
        .system-badge { background-color: rgba(16, 185, 129, 0.15); color: var(--color-success); padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; }
        .diag-item { display: flex; flex-direction: column; gap: 2px; }
        .diag-label { font-size: 0.65rem; text-transform: uppercase; color: #94A3B8; font-weight: 700; }
        .diag-value { font-size: 0.85rem; color: #ffffff; font-weight: 600; }
        .ping-active { color: var(--accent-cyan); animation: pulseText 1.5s infinite alternate; }

        @keyframes pulseText { from { opacity: 0.6; } to { opacity: 1; } }

        /* ==========================================================================
           🌟 NEW: HYPER-SPEED WARP ANIMATION (ZERO LAG)
           ========================================================================== */
        
        body.access-granted .glass-card {
            /* Shrinks back in anticipation, then blasts toward the user fading out */
            animation: warpJump 1.2s forwards cubic-bezier(0.5, -0.5, 0.2, 1);
        }

        body.access-granted .aurora-orb {
            /* Background orbs stretch out and rush past the screen */
            animation: warpOrbs 1.2s forwards cubic-bezier(0.5, 0, 0.2, 1);
        }

        body.access-granted .float-item, 
        body.access-granted .brand-header {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        @keyframes warpJump {
            0% { transform: scale(1); opacity: 1; }
            30% { transform: scale(0.9); opacity: 1; filter: blur(0px); }
            100% { transform: scale(2.5) translate3d(0, -50px, 0); opacity: 0; filter: blur(10px); }
        }

        @keyframes warpOrbs {
            0% { transform: scale(1); opacity: 0.45; }
            100% { transform: scale(4); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Lightweight Background Aurora -->
    <div class="aurora-container">
        <div class="aurora-orb orb-1"></div>
        <div class="aurora-orb orb-2"></div>
        <div class="aurora-orb orb-3"></div>
    </div>

    <!-- Floating Education Objects -->
    <div class="floating-bg">
        <div class="float-item" style="--left: 10%; --duration: 15s; --delay: 0s; --size: 3rem;">📚</div>
        <div class="float-item" style="--left: 30%; --duration: 18s; --delay: 2s; --size: 2.5rem;">🖋️</div>
        <div class="float-item" style="--left: 50%; --duration: 22s; --delay: 5s; --size: 3.5rem;">📖</div>
        <div class="float-item" style="--left: 70%; --duration: 14s; --delay: 1s; --size: 2rem;">✏️</div>
        <div class="float-item" style="--left: 85%; --duration: 20s; --delay: 4s; --size: 3rem;">📘</div>
    </div>

    <div class="brand-header">
        <h1 class="brand-logo">PARA WORLD</h1>
    </div>

    <!-- Interactive Secure Form -->
    <div class="glass-wrapper" id="loginWrapper">
        <form class="glass-card" id="loginForm">
            <div class="glass-title">WELCOME TO PARA</div>
            
            <div class="error-banner" id="errorBanner">Invalid Credentials</div>

            <div class="input-group">
                <input type="email" id="emailInput" class="glass-input" placeholder="Administrator Email" autocomplete="email" required>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" class="glass-input" placeholder="Secret Key" required>
            </div>

            <button type="submit" class="btn-enter" id="enterBtn">LOGIN</button>

            <!-- Diagnostic Center -->
            <div class="diagnostic-card">
                <div class="diag-header">
                    <h4>Diagnostic Center</h4>
                    <span class="system-badge" id="serverState">Analyzing...</span>
                </div>
                <div style="display: flex; gap: 20px;">
                    <div class="diag-item">
                        <span class="diag-label">Latency Ping</span>
                        <span class="diag-value ping-active" id="latencyOutput">calculating...</span>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 15px; color: #94A3B8; font-size: 0.75rem; font-weight: 600;">
                <span style="color: #10B981;">🛡️</span> 256-Bit Encrypted Portal
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const errorBanner = document.getElementById('errorBanner');
            const btn = document.getElementById('enterBtn');
            const serverState = document.getElementById('serverState');
            const latencyOutput = document.getElementById('latencyOutput');

            // Ping Test to check Server Wake State
            const runServerPing = async () => {
                const startTime = performance.now();
                try {
                    const response = await fetch('/', { method: 'HEAD' });
                    const endTime = performance.now();
                    const latency = Math.round(endTime - startTime);

                    if (response.ok) {
                        serverState.textContent = "ONLINE";
                        serverState.style.color = "var(--color-success)";
                        latencyOutput.textContent = `${latency} ms`;
                    }
                } catch (err) {
                    serverState.textContent = "OFFLINE";
                    serverState.style.color = "var(--color-danger)";
                    serverState.style.backgroundColor = "rgba(255,0,0,0.1)";
                    latencyOutput.textContent = "unreachable";
                    latencyOutput.classList.remove('ping-active');
                    latencyOutput.style.color = "var(--color-danger)";
                }
            };
            runServerPing();

            // Login Request
            form.addEventListener('submit', async function(e) {
                e.preventDefault(); 

                const email = emailInput.value;
                const password = passwordInput.value;

                btn.textContent = "VERIFYING...";
                btn.disabled = true;
                errorBanner.style.display = 'none';
                
                try {
                    const response = await fetch('/admin-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const result = await response.json();

                    if (response.ok && result.status === 'success') {
                        // SUCCESS: Trigger the lag-free Hyper-Speed Warp animation
                        btn.textContent = "GRANTED";
                        btn.style.background = "var(--color-success)";
                        btn.style.color = "white";
                        
                        document.body.classList.add('access-granted');
                        
                        // Wait for warp animation to clear the screen, then navigate
                        setTimeout(() => {
                            window.location.href = "/admin-dashboard"; 
                        }, 1200);

                    } else {
                        // FAILED
                        errorBanner.textContent = result.message || "Invalid administrator email or password.";
                        errorBanner.style.display = 'block';
                        btn.textContent = "LOGIN";
                        btn.disabled = false;
                    }
                } catch (err) {
                    errorBanner.textContent = "Server Connection Timeout. Please wait for the server to wake up!";
                    errorBanner.style.display = 'block';
                    btn.textContent = "LOGIN";
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
